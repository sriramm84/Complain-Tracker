<!DOCTYPE html>
<html lang="en" ng-app="complainApp">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — ComplainX</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body style="background:#f5f6f8;min-height:100vh;display:flex;align-items:center;justify-content:center;"
    ng-controller="AuthCtrl" ng-cloak>

    <div style="width:100%;max-width:440px;padding:20px;">
        <div class="card border">
            <div style="padding:32px 36px;">
                <a href="/" style="font-size:0.78rem;color:#6b7280;text-decoration:none;display:block;margin-bottom:20px;">← Back to home</a>
                <div style="font-size:1.1rem;font-weight:700;color:#111827;margin-bottom:2px;">ComplainX</div>
                <div style="font-size:0.78rem;color:#6b7280;margin-bottom:24px;">Create your account</div>

                <div class="alert alert-success" ng-show="successMsg">{{ successMsg }}</div>
                <div class="alert alert-danger"  ng-show="errorMsg">{{ errorMsg }}</div>

                <form ng-submit="register()" novalidate>

                    <div class="mb-3">
                        <label class="form-label">Full Name *</label>
                        <input type="text" id="nameInput" class="form-control form-control-sm"
                            ng-model="formData.name" placeholder="Letters only" />
                        <div id="nameError" style="display:none;font-size:0.75rem;color:#dc2626;margin-top:3px;"></div>
                        <div class="invalid-feedback">Name must contain only letters.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address *</label>
                        <input type="email" id="emailInput" class="form-control form-control-sm"
                            ng-model="formData.email" placeholder="you@example.com" />
                        <div class="invalid-feedback">Enter a valid email address.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number * <span style="font-size:0.72rem;color:#9ca3af;">(10 digits)</span></label>
                        <input type="tel" id="phoneInput" class="form-control form-control-sm"
                            ng-model="formData.phone" placeholder="9876543210" maxlength="10" />
                        <div class="invalid-feedback">Phone must be exactly 10 digits.</div>
                    </div>

                    <div class="row g-2 mb-4">
                        <div class="col-6">
                            <label class="form-label">Password *</label>
                            <input type="password" id="passwordInput" class="form-control form-control-sm"
                                ng-model="formData.password" placeholder="Min. 6 chars"
                                autocomplete="new-password" />
                            <div class="invalid-feedback">At least 6 characters.</div>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Confirm *</label>
                            <input type="password" id="confirmInput" class="form-control form-control-sm"
                                ng-model="formData.confirmPassword" placeholder="Repeat"
                                autocomplete="new-password" />
                            <div class="invalid-feedback">Passwords do not match.</div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100" ng-disabled="loading">
                        <span ng-if="loading" class="spinner-border spinner-border-sm me-2"></span>
                        {{ loading ? 'Creating...' : 'Create Account' }}
                    </button>
                </form>

                <p style="text-align:center;font-size:0.78rem;color:#9ca3af;margin-top:16px;">
                    Already have an account? <a href="/login" style="color:#2563eb;text-decoration:none;">Login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
